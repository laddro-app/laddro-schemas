openapi: 3.1.0
info:
  title: Laddro Cover Letter Schema
  version: 1.0.0
  description: |
    Canonical Cover Letter DTO consumed by laddro-web-app, laddro-backend,
    laddro-career-api, laddro-ai-core, and laddro-career-document-renderer.
    Generated types are published to @laddro-app/schemas (npm) and
    github.com/laddro-app/laddro-schemas/go.

    The cover-letter content is intentionally simpler than the resume — three
    structural blocks (personalDetails, employerDetails, letterContent). The
    same Styling type from resume.v1 is reused for visual settings.

components:
  schemas:
    CoverLetter:
      type: object
      required: [title, locale, content]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          minLength: 1
          maxLength: 200
          example: Cover letter — Senior Product Designer
        locale:
          type: string
          enum: [en, de, es, fr, it, nl, pl, pt, is, fi, sv, no, da, et, ro, cs, sk, hu, lt, lv, uk]
        templateId:
          type: string
          default: emerald
          description: |
            Slug from the cover-letter template catalog. Defaults to `emerald`
            when omitted.
        content:
          $ref: '#/components/schemas/CoverLetterContent'
        styling:
          $ref: '#/components/schemas/CoverLetterStyling'
        completeness:
          type: integer
          minimum: 0
          maximum: 100
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    CoverLetterContent:
      type: object
      required: [personalDetails, employerDetails, letterContent]
      properties:
        personalDetails:
          $ref: '#/components/schemas/CoverLetterPersonalDetails'
        employerDetails:
          $ref: '#/components/schemas/CoverLetterEmployerDetails'
        letterContent:
          type: string
          description: |
            Body of the letter. HTML allowed (paragraphs and lists).

    CoverLetterPersonalDetails:
      type: object
      required: [fullName]
      properties:
        fullName: { type: string }
        jobTitle: { type: string }
        address:  { type: string }
        email:    { type: string, format: email }
        phone:    { type: string }

    CoverLetterEmployerDetails:
      type: object
      properties:
        companyName:       { type: string }
        hiringManagerName: { type: string }

    TemplateColors:
      type: object
      description: |
        A complete template colour palette — the five slots every template
        renders. One row of a cover-letter template's `availableColors` in the
        renderer catalog, stored verbatim so the choice round-trips exactly.

        Duplicated from `resume.v1.yaml` rather than referenced: each spec is
        generated independently (see `scripts/generate-ts.sh`), so a cross-file
        `$ref` would not resolve. Keep the two definitions identical.

        All five are REQUIRED when the object is present — present means
        complete. Omit the whole object to accept the template's default
        palette.
      required:
        - backgroundColor
        - backgroundPartColor
        - underlineColor
        - text
        - textMuted
      properties:
        backgroundColor:
          type: string
          pattern: '^#(?:[0-9a-fA-F]{3}|[0-9a-fA-F]{6})$'
          example: '#ffffff'
        backgroundPartColor:
          type: string
          pattern: '^#(?:[0-9a-fA-F]{3}|[0-9a-fA-F]{6})$'
          example: '#0F6B4F'
        underlineColor:
          type: string
          pattern: '^#(?:[0-9a-fA-F]{3}|[0-9a-fA-F]{6})$'
          example: '#1a1a1a'
        text:
          type: string
          pattern: '^#(?:[0-9a-fA-F]{3}|[0-9a-fA-F]{6})$'
          example: '#1a1a1a'
        textMuted:
          type: string
          pattern: '^#(?:[0-9a-fA-F]{3}|[0-9a-fA-F]{6})$'
          example: '#2d2d2d'

    CoverLetterStyling:
      type: object
      description: |
        Cover letter visual settings. All fields optional — template defaults
        apply when omitted.
      properties:
        colors:
          $ref: '#/components/schemas/TemplateColors'
        color:
          type: string
          description: |
            DEPRECATED as an input, still written for backwards compatibility.
            Readers MUST prefer `colors`; see the note on
            `resume.v1.yaml#/components/schemas/Styling/properties/color`.
          example: '#0F6B4F'
        font:
          type: string
          example: Grift
        fontSize:
          type: integer
          minimum: 8
          maximum: 16
        margin:
          type: number
        lineHeight:
          type: number

    # =================================================================
    # Cover Letter Generation API — request / response for ai-core
    # `POST /v1/cover-letter`. Both the standalone /build-cover-letter
    # page (laddro-web-app → laddro-backend → laddro-ai-core) and the
    # tailor flow (auto-mode trio worker + review-mode post-save trigger)
    # use this single endpoint. Per-field fill-the-gaps: empty inputs are
    # synthesized by ai-core from the provided resume + JD; populated
    # inputs are echoed verbatim. See
    # obsidian/laddro/plans/cover-letter-ai-core.md for the architectural
    # rationale and the locale-template strings.
    # =================================================================

    CoverLetterGenerateRequest:
      type: object
      required: [resume, jobDescription, locale]
      description: |
        Request body for `POST /v1/cover-letter` on laddro-ai-core.

        `initialContent` is a possibly-partial envelope — the caller passes
        whatever it already has from the user (the standalone CL page often
        has everything; the tailor flow usually has only company name on
        `employerDetails`). ai-core fills empty personal fields from the
        resume verbatim and runs a narrow LLM extract on the JD for empty
        employer fields. Always-overwritten: `letterContent` is generated.
      properties:
        initialContent:
          type: object
          description: |
            Partial content envelope. Every nested field is optional. ai-core
            echoes what's provided and fills only the empties.
          properties:
            personalDetails:
              $ref: '#/components/schemas/CoverLetterPersonalDetailsPartial'
            employerDetails:
              $ref: '#/components/schemas/CoverLetterEmployerDetails'
        resume:
          description: |
            The candidate's V1 Resume. Used both as the source for personal
            field fills (firstName, lastName, email, phone, city/country)
            and as the evidence the body writer cites in the experience
            paragraph. Required because we cannot write a believable letter
            without grounding.
          type: object
        jobDescription:
          type: string
          minLength: 1
          description: |
            Raw job description text the user submitted. Used by the employer
            extractor (only when companyName / hiringManagerName are absent)
            and by the body writer to ground the experience paragraph.
        positionName:
          type: string
          description: |
            Position name. Tailor flow always passes this from the form. The
            standalone page may omit it; ai-core falls back to
            `resume.personal.role` when this is absent AND the user did not
            fill `personalDetails.jobTitle`.
        locale:
          type: string
          enum: [en, de, es, fr, it, nl, pl, pt, is, fi, sv, no, da, et, ro, cs, sk, hu, lt, lv, uk]
          description: |
            BCP-47-ish locale code. Drives salutation + closing template
            selection AND the body writer's output language. Every word of
            the returned letter is in this language — no English fallback
            phrases sneak in.
        tone:
          type: string
          enum: [professional, enthusiastic, concise]
          default: professional
          description: |
            Voice for the body writer. `professional` is the default formal
            register most industries expect. `enthusiastic` leans warmer for
            startups / creative roles. `concise` produces tighter
            paragraphs for senior-IC roles that want signal over fluff.

    CoverLetterPersonalDetailsPartial:
      type: object
      description: |
        Same fields as `CoverLetterPersonalDetails` but every field is
        optional. Used in `CoverLetterGenerateRequest.initialContent` so
        the caller can submit whatever it already has (or nothing) and let
        ai-core fill the gaps from the resume.
      properties:
        fullName: { type: string }
        jobTitle: { type: string }
        address: { type: string }
        email: { type: string, format: email }
        phone: { type: string }

    CoverLetterGenerateResponse:
      type: object
      required: [content, filled, usage]
      description: |
        Result of a `POST /v1/cover-letter` call. `content` is the existing
        `CoverLetterContent` shape — same envelope the editor and the
        renderer already consume — so the response is drop-in for both the
        standalone page (which then opens the editor) and the tailor worker
        (which persists it into the reserved CL UUID slot).
      properties:
        content:
          $ref: '#/components/schemas/CoverLetterContent'
        filled:
          type: object
          required: [personalDetails, employerDetails]
          description: |
            Which fields ai-core synthesized vs echoed from the request.
            Lets the standalone CL editor render a subtle "AI filled this"
            badge so the user knows which fields to double-check. Empty
            arrays mean the caller provided every field verbatim.
          properties:
            personalDetails:
              type: array
              items:
                type: string
                enum: [fullName, jobTitle, address, email, phone]
            employerDetails:
              type: array
              items:
                type: string
                enum: [companyName, hiringManagerName]
        usage:
          $ref: '#/components/schemas/GenerationUsage'

    GenerationUsage:
      type: object
      required: [promptTokens, outputTokens, model]
      description: |
        Per-call usage block returned by ai-core for any LLM-backed endpoint.
        Centralised in the cover-letter spec because that's the first place
        we need it; the tailor spec will reuse this shape once the same
        accounting is added to `/v1/tailor`.
      properties:
        promptTokens:
          type: integer
          minimum: 0
          description: Sum of input tokens across the extractor + writer calls.
        outputTokens:
          type: integer
          minimum: 0
          description: Sum of output tokens across the extractor + writer calls.
        model:
          type: string
          description: |
            Provider + model that produced the body (`gemini-2.5-flash` /
            `gpt-4.1-mini` / `claude-sonnet-4-6` / ...). Reflects the writer
            call only — the extractor reports separately when needed.
