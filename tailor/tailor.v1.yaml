openapi: 3.1.0
info:
  title: Laddro Tailor Schema
  version: 2.0.0
  description: |
    Canonical contract for the honest-tailor pipeline. Single source of truth
    consumed by:
      - laddro-ai-nlp        (Python semantic worker — produces JobDescription)
      - laddro-ai-core       (Go orchestrator — scores, recommends, calls LLM writer)
      - laddro-backend       (NestJS proxy + drafts persistence)
      - laddro-web-app       (Next.js suggestion-card UI, score header)

    Generated types are published to @laddro-app/schemas (npm) and
    github.com/laddro-app/laddro-schemas/go/tailor. Pydantic models for the
    Python worker are generated by the same script.

    ## Hard rules built into this contract

    1. **No regex, no keyword matching.** Every classification field on this
       page (Seniority.level, Skill.required, Requirement.category, etc.) is
       a model output. The fixed enum sets below are what the model emits
       and what code switches on — NEVER something to grep user text for.
       If a future change requires hardcoded text matching to populate any
       field, the contract is wrong and must be revisited, not patched.

    2. **All 14 locales × all industries, day one.** This contract is locale-
       and industry-agnostic by construction. The worker must emit these
       fields for English tech AND Polish healthcare AND Estonian trades.
       Fixtures under `fixtures/worker-output/` enforce this — `<locale>/
       <industry>/<slug>.{input,expected}.json` pairs covering 14 locales ×
       ≥8 industries. CI fails when any pair is missing or drifts.

    3. **Source spans are preserved.** Skill.source_quote and
       Requirement.source_quote keep the original span so the frontend can
       quote "this came from this line in the JD" back to the user. Spans
       are stored verbatim in the JD's language; never translated.

    1.0.0 (2026-06-09): Initial contract, replaces the regex-based
    extraction in laddro-ai-core/internal/tailor/analysis/jd_parser.go.
    Suggestions carry a typed `target` (BulletTarget | SummaryTarget |
    SkillTarget) so the frontend applies accepts deterministically; the
    response includes a `fit_verdict` so we can refuse to tailor honestly
    when the resume doesn't match the JD at all (the "honest tailor"
    promise made explicit at the API).

    2.0.0 (2026-06-09): BREAKING. Skill.id and Requirement.id are now
    required. Without stable IDs, Suggestion.requirement_ref had no shape
    to resolve to — it was opaque. The new IDs are UUIDs assigned by the
    worker at extraction time and scoped to a single TailorResponse (not
    stable across calls). Fixtures and Pydantic models updated; ai-core
    + frontend consume the bumped types from @laddro-app/schemas@0.5.0.

components:
  schemas:

    # ─────────────────────────────────────────────────────────────
    #  Worker contract (laddro-ai-nlp → laddro-ai-core)
    # ─────────────────────────────────────────────────────────────

    WorkerAnalyzeRequest:
      type: object
      required: [text, locale]
      properties:
        text:
          type: string
          minLength: 1
          description: Raw job description as the user pasted it.
        locale:
          type: string
          enum: [en, de, es, fr, it, nl, pl, pt, is, fi, sv, no, da, et]

    WorkerAnalyzeResponse:
      $ref: '#/components/schemas/JobDescription'

    JobDescription:
      type: object
      required: [raw_text, locale, seniority, skills, requirements]
      properties:
        raw_text:
          type: string
          description: The original input, preserved verbatim for source-span lookups.
        locale:
          type: string
          enum: [en, de, es, fr, it, nl, pl, pt, is, fi, sv, no, da, et]
        title:
          type: string
          description: |
            Job title as identified by NER, in the JD's source language. Empty
            string when the model could not identify one. Never falls back to
            "first non-empty line" or any other structural heuristic.
        company:
          type: string
          description: |
            Company / organization name from NER. Empty string when none
            detected. Never falls back to text patterns.
        seniority:
          $ref: '#/components/schemas/Seniority'
        skills:
          type: array
          items: { $ref: '#/components/schemas/Skill' }
        requirements:
          type: array
          items: { $ref: '#/components/schemas/Requirement' }

    Seniority:
      type: object
      required: [level, confidence]
      properties:
        level:
          type: string
          enum: [entry, mid, senior, lead, unknown]
          description: |
            Seniority bucket, classified by a multilingual model. `unknown`
            when the model's confidence is below the configured floor — NEVER
            inferred from years_min via a hardcoded ladder.
        years_min:
          type: integer
          minimum: 0
          description: |
            Minimum years-of-experience asked for, extracted via locale-aware
            structured extraction. 0 when none stated. Phrasing varies wildly
            across locales ("3+ years", "Berufserfahrung von 3 Jahren",
            "5 vuoden kokemus") — extraction is the model's job, not regex.
        years_max:
          type: integer
          minimum: 0
          description: Maximum years asked for. 0 when none stated.
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: Model confidence in the `level` label.

    Skill:
      type: object
      required: [id, label, normalized, required, confidence, source_quote]
      properties:
        id:
          type: string
          format: uuid
          description: |
            Stable identifier. The worker assigns a UUID at extraction time
            so the orchestrator and the frontend can reference the same
            Skill across the request → suggestion → fill round-trip. Suggestion
            records targeting this skill set `requirement_ref` to this UUID.
            Different worker calls on the same JD MAY produce different
            UUIDs — IDs are scoped to a single TailorResponse, not stable
            across calls.
        label:
          type: string
          description: Skill name as it appeared in the JD, in source language.
        normalized:
          type: string
          description: |
            Canonical form for deduplication only. Produced by the model's
            normalizer (lowercase + locale-aware diacritic handling). Not
            used for semantic matching — that's embeddings' job.
        esco_id:
          type: string
          description: |
            ESCO concept URI when the multilingual ESCO linker matched this
            skill. Empty when no link — scorer falls back to embedding
            similarity, never to string matching.
        required:
          type: boolean
          description: |
            Whether the JD treats this skill as required vs nice-to-have.
            This is a span-classifier output across all 14 locales — NOT a
            keyword scan over "required"/"must have"/"nice to have". When
            the classifier's confidence is below the configured floor, the
            worker omits the skill rather than defaulting to required.
        confidence:
          type: number
          minimum: 0
          maximum: 1
        source_quote:
          type: string
          description: |
            The original span the model attributed this skill to, verbatim
            from raw_text. The frontend shows it as "from the JD: ...".

    Requirement:
      type: object
      required: [id, text, category, confidence, source_quote]
      properties:
        id:
          type: string
          format: uuid
          description: |
            Stable identifier scoped to a single TailorResponse. Suggestion
            records targeting this requirement set `requirement_ref` to
            this UUID. See Skill.id for the same scoping rule.
        text:
          type: string
          description: The requirement span, verbatim from raw_text.
        category:
          type: string
          enum: [skill, responsibility, qualification, experience, soft]
          description: |
            Canonical category, classified by the model. This set is
            deliberately industry-agnostic: a nurse's "patient handover" and
            an engineer's "deploy to prod" both map to `responsibility`. A
            welder's "MIG certification" and a lawyer's "bar admission" both
            map to `qualification`. New categories require a contract bump,
            not a code patch.
        confidence:
          type: number
          minimum: 0
          maximum: 1
        source_quote:
          type: string

    # ─────────────────────────────────────────────────────────────
    #  Tailor API (laddro-ai-core /v1/tailor)
    # ─────────────────────────────────────────────────────────────

    TailorRequest:
      type: object
      required: [resume, job_description, locale]
      properties:
        resume:
          description: |
            The full Resume DTO. ai-core consumes it typed and walks every
            section, item, and description in order to produce Suggestions
            with valid `target.section_index` / `target.item_index` indices
            into THIS resume. The frontend must send the resume verbatim
            (no stripping) so suggestions remain applicable.

            Consumers MUST import the typed Resume from
            `@laddro-app/schemas/resume`:
              - TS:  `import type { components } from '@laddro-app/schemas/resume'`
                     then `components['schemas']['Resume']`
              - Go:  `github.com/laddro-app/laddro-schemas/go/resume.Resume`

            The field is declared as `type: object` here only because OpenAPI
            3.1 cross-file `$ref` support is uneven across our codegen tools.
            Treat it as `Resume` at every call site.
          type: object
        job_description:
          type: string
          minLength: 1
          description: Raw JD text. The worker parses it.
        locale:
          type: string
          enum: [en, de, es, fr, it, nl, pl, pt, is, fi, sv, no, da, et]

    TailorResponse:
      type: object
      required: [parsed_job, compatibility_score, fit_verdict, suggestions]
      properties:
        parsed_job:
          $ref: '#/components/schemas/JobDescription'
        compatibility_score:
          $ref: '#/components/schemas/CompatibilityScore'
        fit_verdict:
          type: string
          enum: [strong_fit, partial_fit, weak_fit, no_fit]
          description: |
            Honest verdict on whether this resume can be tailored to this JD
            at all. Derived from compatibility_score, the recommender's anchor
            coverage (how many required skills have any resume evidence), and
            the seniority gap.

            - `strong_fit`   normal stack, most requirements have anchors.
            - `partial_fit`  normal stack, some gaps the user should know about.
            - `weak_fit`     stack rendered with a banner: "low fit, consider
                             a different job — these are what we could find."
            - `no_fit`       suggestions[] is empty by construction. Frontend
                             shows "this isn't your job — we don't fake resumes,
                             we prepare you for the job." Backed by no_fit_reason.

            ai-core owns the decision rule. Frontend branches UX off this enum
            only — it never re-derives the verdict from the score.
        no_fit_reason:
          description: |
            Present when fit_verdict is `weak_fit` or `no_fit`. Machine-readable
            primary cause + locale-aware human explanation the frontend can
            surface verbatim.
          allOf:
            - $ref: '#/components/schemas/NoFitReason'
        suggestions:
          type: array
          items: { $ref: '#/components/schemas/Suggestion' }

    NoFitReason:
      type: object
      required: [primary, explanation]
      properties:
        primary:
          type: string
          enum: [skills_gap, seniority_gap, industry_mismatch, insufficient_evidence]
          description: |
            - `skills_gap`            JD's required skills aren't present in the resume
                                      and no anchors support adding them.
            - `seniority_gap`         Resume's experience level is materially off from
                                      what the JD asks for (junior → director, or vice
                                      versa).
            - `industry_mismatch`     Resume's occupation graph and the JD's occupation
                                      don't overlap (nurse vs. backend engineer).
            - `insufficient_evidence` Resume itself is too thin (empty descriptions,
                                      no experiences) for any meaningful matching.
        explanation:
          type: string
          description: |
            One- or two-sentence reason in the user's locale, drawn from i18n
            strings — not free-form LLM output. Frontend shows verbatim.

    CompatibilityScore:
      type: object
      required: [total, breakdown]
      properties:
        total:
          type: integer
          minimum: 0
          maximum: 100
          description: |
            Live-updating score shown at top of suggestion stack. Recomputed
            client-side as suggestions are accepted/discarded using the same
            formula the backend would produce.
        breakdown:
          $ref: '#/components/schemas/ScoreBreakdown'

    ScoreBreakdown:
      type: object
      required: [exact_skills, adjacent_skills, seniority_fit]
      properties:
        exact_skills:
          type: number
          minimum: 0
          maximum: 1
          description: Share of required skills the resume already covers exactly.
        adjacent_skills:
          type: number
          minimum: 0
          maximum: 1
          description: |
            Share covered by semantically-adjacent skills (embedding
            similarity above the calibrated threshold). NEVER token overlap.
        seniority_fit:
          type: number
          minimum: 0
          maximum: 1
          description: |
            How well the resume's experience aligns with JobDescription.
            seniority — calibrated against the eval set, not a hardcoded
            ladder.

    Suggestion:
      type: object
      required: [id, kind, target, original_text, instruction, requirement_ref]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [rewrite_bullet, add_bullet, rewrite_summary, add_skill]
          description: |
            What this suggestion does to the resume. Each kind has a matching
            `target` shape (see SuggestionTarget) and a per-kind meaning for
            `original_text`:

            - `rewrite_bullet`   Replace one `<li>` (or `<p>`) inside
                                 `resume.sections[target.section_index].items[target.item_index].description`.
                                 `original_text` is the verbatim HTML fragment
                                 to find and replace.
            - `add_bullet`       Append a new `<li>` to the same description.
                                 `original_text` is the resume "anchor" — the
                                 existing experience text the new bullet must
                                 stay faithful to. The anchor is NOT in the
                                 description being mutated; it's evidence from
                                 elsewhere in the resume.
            - `rewrite_summary`  Replace `resume.summary.value` entirely.
                                 `original_text` is the current summary verbatim.
            - `add_skill`        Append a SkillItem to a SkillsSection.
                                 `original_text` is the bullet/text from the
                                 resume that proves the user already has the
                                 skill. Refused (no suggestion emitted) when
                                 no anchor exists — the no-fabrication gate.

            Suggestions can be applied in any order. Frontend matches the
            verbatim `original_text` substring on `rewrite_*` to stay robust
            against user edits between fetch and accept; if not found, the
            card goes stale-grayed in the UI.
        target:
          $ref: '#/components/schemas/SuggestionTarget'
        original_text:
          type: string
          description: |
            Per-kind semantics — see `kind`. Always shown to the user as proof
            of grounding ("from your resume: ...").
        instruction:
          type: string
          description: |
            Locale-aware instruction the writer LLM uses to produce
            proposed_text. Generated by the recommender, not free-form.
        proposed_text:
          type: string
          description: |
            Empty until the writer LLM is called for this suggestion (lazy
            per-card via /v1/tailor/fill). Discarded suggestions stay empty
            and cost zero LLM tokens.
        requirement_ref:
          type: string
          description: |
            ID of the JobDescription requirement (or skill) this suggestion
            addresses. Lets the frontend show "this card addresses THIS ask
            from the JD" with the source_quote highlighted.

    SuggestionTarget:
      description: |
        Discriminated union pointing at the exact Resume object a Suggestion
        mutates. `scope` matches the Suggestion.kind's natural target:
          rewrite_bullet, add_bullet  → BulletTarget   (scope=bullet)
          rewrite_summary             → SummaryTarget  (scope=summary)
          add_skill                   → SkillTarget    (scope=skill)
      oneOf:
        - $ref: '#/components/schemas/BulletTarget'
        - $ref: '#/components/schemas/SummaryTarget'
        - $ref: '#/components/schemas/SkillTarget'
      discriminator:
        propertyName: scope
        mapping:
          bullet:  '#/components/schemas/BulletTarget'
          summary: '#/components/schemas/SummaryTarget'
          skill:   '#/components/schemas/SkillTarget'

    BulletTarget:
      type: object
      required: [scope, section_index, item_index]
      properties:
        scope:
          type: string
          enum: [bullet]
        section_index:
          type: integer
          minimum: 0
          description: Index into `resume.sections[]`.
        item_index:
          type: integer
          minimum: 0
          description: |
            Index into `resume.sections[section_index].items[]`. The pointed-at
            section MUST be one whose items have a `description` field:
            employment, education, certifications, projects,
            extraCurricularActivities. Skills/Languages/References sections
            are not valid targets for rewrite_bullet/add_bullet.

    SummaryTarget:
      type: object
      required: [scope]
      properties:
        scope:
          type: string
          enum: [summary]
      description: |
        Targets `resume.summary.value`. No indices — there's exactly one summary.

    SkillTarget:
      type: object
      required: [scope, section_index]
      properties:
        scope:
          type: string
          enum: [skill]
        section_index:
          type: integer
          minimum: 0
          description: |
            Index into `resume.sections[]`. The pointed-at section MUST be a
            SkillsSection (`type: skills`). For `add_skill`, the new SkillItem
            is appended to `items[]`.

    # ─────────────────────────────────────────────────────────────
    #  Lazy fill endpoint (laddro-ai-core /v1/tailor/fill)
    # ─────────────────────────────────────────────────────────────

    FillRequest:
      type: object
      required: [suggestion, evidence, locale]
      properties:
        suggestion:
          $ref: '#/components/schemas/Suggestion'
        evidence:
          type: array
          description: |
            Resume spans the writer is allowed to draw from. The writer
            refuses (422) when none of the evidence supports the instruction
            — the no-fabrication gate. Every span carries a structured
            EvidenceSource so the writer's grounding is auditable: we can
            always answer "which bullet did this proposed text come from?"
          items:
            $ref: '#/components/schemas/Evidence'
        locale:
          type: string
          enum: [en, de, es, fr, it, nl, pl, pt, is, fi, sv, no, da, et]

    Evidence:
      type: object
      required: [text, source]
      properties:
        text:
          type: string
          description: The evidence text verbatim from the resume.
        source:
          $ref: '#/components/schemas/EvidenceSource'

    EvidenceSource:
      type: object
      required: [section_index, item_index]
      properties:
        section_index:
          type: integer
          minimum: 0
          description: Index into `resume.sections[]` this evidence came from.
        item_index:
          type: integer
          minimum: 0
          description: Index into that section's `items[]`.
        fragment_anchor:
          type: string
          description: |
            Verbatim HTML fragment within the item's description (or skill
            label / etc) that this evidence quotes. Empty when the evidence
            is the whole item (e.g. a SkillItem or LanguageItem). Used by
            auditing and by the writer to know exactly which span to ground
            against — NEVER for regex or substring rewriting in the writer.

    FillResponse:
      type: object
      required: [proposed_text]
      properties:
        proposed_text:
          type: string
          description: |
            Writer LLM output, in the requested locale. Single bullet, no
            headers, no preamble. Strictly grounded in `evidence`.

paths: {}
