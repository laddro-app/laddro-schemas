openapi: 3.1.0
info:
  title: Laddro Tailor Schema
  version: 1.0.0
  description: |
    Canonical contract for the honest-tailor pipeline. Single source of truth
    consumed by:
      - laddro-ai-nlp        (Python semantic worker — produces JobDescription)
      - laddro-ai-core       (Go orchestrator — scores, recommends, calls LLM writer)
      - laddro-backend       (NestJS proxy + drafts persistence)
      - laddro-web-app       (Next.js suggestion-card UI, score header)

    Generated types are published to @laddro-app/schemas (npm) and
    github.com/laddro-app/laddro-schemas/go/tailor. Pydantic models for the
    Python worker are generated by the same script.

    ## Hard rules built into this contract

    1. **No regex, no keyword matching.** Every classification field on this
       page (Seniority.level, Skill.required, Requirement.category, etc.) is
       a model output. The fixed enum sets below are what the model emits
       and what code switches on — NEVER something to grep user text for.
       If a future change requires hardcoded text matching to populate any
       field, the contract is wrong and must be revisited, not patched.

    2. **All 14 locales × all industries, day one.** This contract is locale-
       and industry-agnostic by construction. The worker must emit these
       fields for English tech AND Polish healthcare AND Estonian trades.
       Fixtures under `fixtures/worker-output/` enforce this — `<locale>/
       <industry>/<slug>.{input,expected}.json` pairs covering 14 locales ×
       ≥8 industries. CI fails when any pair is missing or drifts.

    3. **Source spans are preserved.** Skill.source_quote and
       Requirement.source_quote keep the original span so the frontend can
       quote "this came from this line in the JD" back to the user. Spans
       are stored verbatim in the JD's language; never translated.

    1.0.0 (2026-06-09): Initial contract, replaces the regex-based
    extraction in laddro-ai-core/internal/tailor/analysis/jd_parser.go.

components:
  schemas:

    # ─────────────────────────────────────────────────────────────
    #  Worker contract (laddro-ai-nlp → laddro-ai-core)
    # ─────────────────────────────────────────────────────────────

    WorkerAnalyzeRequest:
      type: object
      required: [text, locale]
      properties:
        text:
          type: string
          minLength: 1
          description: Raw job description as the user pasted it.
        locale:
          type: string
          enum: [en, de, es, fr, it, nl, pl, pt, is, fi, sv, no, da, et]

    WorkerAnalyzeResponse:
      $ref: '#/components/schemas/JobDescription'

    JobDescription:
      type: object
      required: [raw_text, locale, seniority, skills, requirements]
      properties:
        raw_text:
          type: string
          description: The original input, preserved verbatim for source-span lookups.
        locale:
          type: string
          enum: [en, de, es, fr, it, nl, pl, pt, is, fi, sv, no, da, et]
        title:
          type: string
          description: |
            Job title as identified by NER, in the JD's source language. Empty
            string when the model could not identify one. Never falls back to
            "first non-empty line" or any other structural heuristic.
        company:
          type: string
          description: |
            Company / organization name from NER. Empty string when none
            detected. Never falls back to text patterns.
        seniority:
          $ref: '#/components/schemas/Seniority'
        skills:
          type: array
          items: { $ref: '#/components/schemas/Skill' }
        requirements:
          type: array
          items: { $ref: '#/components/schemas/Requirement' }

    Seniority:
      type: object
      required: [level, confidence]
      properties:
        level:
          type: string
          enum: [entry, mid, senior, lead, unknown]
          description: |
            Seniority bucket, classified by a multilingual model. `unknown`
            when the model's confidence is below the configured floor — NEVER
            inferred from years_min via a hardcoded ladder.
        years_min:
          type: integer
          minimum: 0
          description: |
            Minimum years-of-experience asked for, extracted via locale-aware
            structured extraction. 0 when none stated. Phrasing varies wildly
            across locales ("3+ years", "Berufserfahrung von 3 Jahren",
            "5 vuoden kokemus") — extraction is the model's job, not regex.
        years_max:
          type: integer
          minimum: 0
          description: Maximum years asked for. 0 when none stated.
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: Model confidence in the `level` label.

    Skill:
      type: object
      required: [label, normalized, required, confidence, source_quote]
      properties:
        label:
          type: string
          description: Skill name as it appeared in the JD, in source language.
        normalized:
          type: string
          description: |
            Canonical form for deduplication only. Produced by the model's
            normalizer (lowercase + locale-aware diacritic handling). Not
            used for semantic matching — that's embeddings' job.
        esco_id:
          type: string
          description: |
            ESCO concept URI when the multilingual ESCO linker matched this
            skill. Empty when no link — scorer falls back to embedding
            similarity, never to string matching.
        required:
          type: boolean
          description: |
            Whether the JD treats this skill as required vs nice-to-have.
            This is a span-classifier output across all 14 locales — NOT a
            keyword scan over "required"/"must have"/"nice to have". When
            the classifier's confidence is below the configured floor, the
            worker omits the skill rather than defaulting to required.
        confidence:
          type: number
          minimum: 0
          maximum: 1
        source_quote:
          type: string
          description: |
            The original span the model attributed this skill to, verbatim
            from raw_text. The frontend shows it as "from the JD: ...".

    Requirement:
      type: object
      required: [text, category, confidence, source_quote]
      properties:
        text:
          type: string
          description: The requirement span, verbatim from raw_text.
        category:
          type: string
          enum: [skill, responsibility, qualification, experience, soft]
          description: |
            Canonical category, classified by the model. This set is
            deliberately industry-agnostic: a nurse's "patient handover" and
            an engineer's "deploy to prod" both map to `responsibility`. A
            welder's "MIG certification" and a lawyer's "bar admission" both
            map to `qualification`. New categories require a contract bump,
            not a code patch.
        confidence:
          type: number
          minimum: 0
          maximum: 1
        source_quote:
          type: string

    # ─────────────────────────────────────────────────────────────
    #  Tailor API (laddro-ai-core /v1/tailor)
    # ─────────────────────────────────────────────────────────────

    TailorRequest:
      type: object
      required: [resume, job_description, locale]
      properties:
        resume:
          description: |
            Full Resume DTO from @laddro-app/schemas/resume. Reffed loosely
            here because YAML cross-spec refs are awkward — code uses the
            generated Resume type directly.
          type: object
        job_description:
          type: string
          minLength: 1
          description: Raw JD text. The worker parses it.
        locale:
          type: string
          enum: [en, de, es, fr, it, nl, pl, pt, is, fi, sv, no, da, et]

    TailorResponse:
      type: object
      required: [parsed_job, compatibility_score, suggestions]
      properties:
        parsed_job:
          $ref: '#/components/schemas/JobDescription'
        compatibility_score:
          $ref: '#/components/schemas/CompatibilityScore'
        suggestions:
          type: array
          items: { $ref: '#/components/schemas/Suggestion' }

    CompatibilityScore:
      type: object
      required: [total, breakdown]
      properties:
        total:
          type: integer
          minimum: 0
          maximum: 100
          description: |
            Live-updating score shown at top of suggestion stack. Recomputed
            client-side as suggestions are accepted/discarded using the same
            formula the backend would produce.
        breakdown:
          $ref: '#/components/schemas/ScoreBreakdown'

    ScoreBreakdown:
      type: object
      required: [exact_skills, adjacent_skills, seniority_fit]
      properties:
        exact_skills:
          type: number
          minimum: 0
          maximum: 1
          description: Share of required skills the resume already covers exactly.
        adjacent_skills:
          type: number
          minimum: 0
          maximum: 1
          description: |
            Share covered by semantically-adjacent skills (embedding
            similarity above the calibrated threshold). NEVER token overlap.
        seniority_fit:
          type: number
          minimum: 0
          maximum: 1
          description: |
            How well the resume's experience aligns with JobDescription.
            seniority — calibrated against the eval set, not a hardcoded
            ladder.

    Suggestion:
      type: object
      required: [id, type, original_text, instruction, requirement_ref]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [rewrite_bullet, add_bullet]
          description: |
            `rewrite_bullet` — there's an existing bullet the user can sharpen
            to match the requirement. `original_text` is the bullet,
            `instruction` is what to change.

            `add_bullet` — the requirement is missing entirely AND we found
            a resume anchor (existing experience that plausibly supports
            it). `original_text` is the anchor span the new bullet must
            stay faithful to; the writer is forbidden from going beyond it.
        original_text:
          type: string
          description: |
            For rewrite: the bullet text. For add: the anchor span from the
            resume. Quoted to the user as proof we're not fabricating.
        instruction:
          type: string
          description: |
            Locale-aware instruction the writer LLM uses to produce
            proposed_text. Generated by the recommender, not free-form.
        proposed_text:
          type: string
          description: |
            Empty until the writer LLM is called for this suggestion (lazy
            per-card via /v1/tailor/fill). Discarded suggestions stay empty
            and cost zero LLM tokens.
        requirement_ref:
          type: string
          description: |
            ID of the JobDescription.requirement (or skill) this suggestion
            addresses. Lets the frontend show "this card addresses THIS ask
            from the JD" with the source_quote highlighted.

    # ─────────────────────────────────────────────────────────────
    #  Lazy fill endpoint (laddro-ai-core /v1/tailor/fill)
    # ─────────────────────────────────────────────────────────────

    FillRequest:
      type: object
      required: [suggestion, evidence, locale]
      properties:
        suggestion:
          $ref: '#/components/schemas/Suggestion'
        evidence:
          type: array
          description: |
            Resume bullets / facts the writer is allowed to draw from. The
            writer refuses (422) when none of the evidence supports the
            instruction — the no-fabrication gate.
          items:
            type: object
            required: [text, source]
            properties:
              text:   { type: string }
              source: { type: string, description: "e.g. 'experience[0].bullets[2]'" }
        locale:
          type: string
          enum: [en, de, es, fr, it, nl, pl, pt, is, fi, sv, no, da, et]

    FillResponse:
      type: object
      required: [proposed_text]
      properties:
        proposed_text:
          type: string
          description: |
            Writer LLM output, in the requested locale. Single bullet, no
            headers, no preamble. Strictly grounded in `evidence`.

paths: {}
